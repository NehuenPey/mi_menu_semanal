<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#286b3a">
  <meta name="description" content="Organizá las comidas de la semana de forma sencilla.">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="styles.css">
  <link rel="icon" type="image/png" href="icon.svg">
  <title>Menú de la semana</title>
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand-icon" aria-hidden="true">🍲</div>
      <div>
        <p class="eyebrow">Comidas</p>
        <h1>Menú de la semana</h1>
      </div>
    </header>

    <section class="week-panel" aria-label="Semana seleccionada">
      <button class="icon-button" id="prevWeek" aria-label="Semana anterior">‹</button>
      <div class="week-label">
        <span id="weekRange">Esta semana</span>
        <small id="weekNumber"></small>
      </div>
      <button class="icon-button" id="nextWeek" aria-label="Semana siguiente">›</button>
    </section>

    <div class="actions">
      <button class="secondary-button" id="clearWeek">Limpiar menú de la semana</button>
    </div>

    <section id="days" class="days" aria-label="Comidas de la semana"></section>

    <footer>
      <span class="save-dot" aria-hidden="true"></span>
      Tus cambios se guardan automáticamente en este celular.
    </footer>
  </main>

  <dialog id="mealDialog">
    <form method="dialog" id="mealForm">
      <div class="dialog-top">
        <div>
          <p class="eyebrow" id="mealMoment">MEDIODÍA</p>
          <h2 id="mealTitle">¿Qué van a comer?</h2>
        </div>
        <button type="button" class="close-button" id="closeDialog" aria-label="Cerrar">×</button>
      </div>
      <label for="mealInput">Nombre de la comida</label>
      <textarea id="mealInput" rows="3" maxlength="160" placeholder="Por ejemplo: milanesas con puré" autocomplete="off"></textarea>
      <p class="hint">Podés escribirlo con tus palabras.</p>
      <div class="dialog-actions">
        <button type="button" class="delete-button" id="deleteMeal">Borrar</button>
        <button type="submit" class="primary-button">Guardar comida</button>
      </div>
    </form>
  </dialog>

  <dialog id="confirmDialog" class="confirm-dialog">
    <form method="dialog">
      <h2 id="confirmTitle">¿Querés continuar?</h2>
      <p id="confirmText"></p>
      <div class="dialog-actions">
        <button class="secondary-button" value="cancel">Cancelar</button>
        <button class="primary-button" id="confirmYes" value="yes">Sí, continuar</button>
      </div>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
  <script src="app.js"></script>
</body>
</html>
